name: Build Tile Trails APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate app icon
        run: |
          if [ ! -f app-icon.png ]; then
            echo "ERROR: app-icon.png not found"
            exit 1
          fi

          npm install --no-save @capacitor/assets

          mkdir -p assets
          cp app-icon.png assets/icon-only.png

          npx capacitor-assets generate --android

      - name: Configure Appodeal
        env:
          APPODEAL_APP_KEY: ${{ secrets.APPODEAL_APP_KEY }}
        run: |
          if [ -z "$APPODEAL_APP_KEY" ]; then
            echo "ERROR: APPODEAL_APP_KEY secret is missing"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------------------------------------------------------
          # 1. Configure android/settings.gradle
          # ---------------------------------------------------------

          settings = Path("android/settings.gradle")

          if not settings.exists():
              raise SystemExit("ERROR: android/settings.gradle was not generated")

          text = settings.read_text()

          appodeal_repo = 'maven { url = uri("https://artifactory.appodeal.com/appodeal") }'

          # Remove any previous Appodeal repository lines.
          text = re.sub(
              r'^\s*maven\s*\{\s*url\s*=\s*uri["\']https://artifactory\.appodeal\.com/appodeal["\']\s*\}\s*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # Locate dependencyResolutionManagement.
          drm_match = re.search(
              r'dependencyResolutionManagement\s*\{',
              text
          )

          if drm_match:
              drm_start = drm_match.start()

              # Find the repositories block after dependencyResolutionManagement.
              repos_match = re.search(
                  r'\brepositories\s*\{',
                  text[drm_start:]
              )

              if not repos_match:
                  raise SystemExit(
                      "ERROR: Could not find repositories block inside "
                      "dependencyResolutionManagement"
                  )

              repos_start = drm_start + repos_match.end()

              text = (
                  text[:repos_start]
                  + "\n        "
                  + appodeal_repo
                  + "\n"
                  + text[repos_start:]
              )

          else:
              # Add a complete dependencyResolutionManagement block.
              block = """
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://artifactory.appodeal.com/appodeal") }
              }
          }

          """

              text = block + text

          settings.write_text(text)

          print("Configured Appodeal Maven repository in android/settings.gradle")

          # ---------------------------------------------------------
          # 2. Configure android/app/build.gradle
          # ---------------------------------------------------------

          app_gradle = Path("android/app/build.gradle")

          if not app_gradle.exists():
              raise SystemExit("ERROR: android/app/build.gradle was not generated")

          app_text = app_gradle.read_text()

          dependencies = [
              'implementation("com.appodeal.ads.sdk:core:4.4.0")',

              # Appodeal adapters
              'implementation("com.appodeal.ads.sdk.adapters:amazon:12.0.0.0")',
              'implementation("com.appodeal.ads.sdk.adapters:applovin:13.6.3.0")',
              'implementation("com.appodeal.ads.sdk.adapters:applovin_max:13.6.3.1")',
              'implementation("com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0")',
              'implementation("com.appodeal.ads.sdk.adapters:bidon:0.14.0.0")',
              'implementation("com.appodeal.ads.sdk.adapters:bigo_ads:5.9.0.0")',
              'implementation("com.appodeal.ads.sdk.adapters:chartboost:9.10.2.0")',
              'implementation("com.appodeal.ads.sdk.adapters:dt_exchange:8.4.6.0")',
              'implementation("com.appodeal.ads.sdk.adapters:iab:1.8.1.1")',
              'implementation("com.appodeal.ads.sdk.adapters:inmobi:11.3.0.0")',
              'implementation("com.appodeal.ads.sdk.adapters:ironsource:9.4.4.0")',
              'implementation("com.appodeal.ads.sdk.adapters:level_play:9.4.4.0")',
              'implementation("com.appode                             public void onInitializationFinished(
                                      @Nullable List<ApdInitializationError> errors) {

                                  Appodeal.show(
                                          MainActivity.this,
                                          Appodeal.BANNER
                                  );
                              }
                          }
                  );
              }
          }
          """ % key

          activity.write_text(java)

          print("Appodeal configuration completed.")
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tile-trails-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove Appodeal secret
        env:
          APPODEAL_APP_KEY: ${{ secrets.APPODEAL_APP_KEY }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          key = os.environ.get(
              "APPODEAL_APP_KEY",
              ""
          )

          if key:

              for file in Path("android").rglob("*"):

                  if not file.is_file():
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  if key in text:

                      file.write_text(
                          text.replace(
                              key,
                              "APPODEAL_APP_KEY"
                          )
                      )

          print("Secret removed from Android files.")
          PY

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes to commit."
          else
            git commit -m "Generate Android project with Appodeal"
            git push
          fi
