name: Build Tile Trails APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate app icon
        run: |
          if [ ! -f app-icon.png ]; then
            echo "ERROR: app-icon.png not found"
            exit 1
          fi

          npm install --no-save @capacitor/assets

          mkdir -p assets
          cp app-icon.png assets/icon-only.png

          npx capacitor-assets generate --android

      - name: Configure Appodeal
        env:
          APPODEAL_APP_KEY: ${{ secrets.APPODEAL_APP_KEY }}
        run: |
          if [ -z "$APPODEAL_APP_KEY" ]; then
            echo "ERROR: APPODEAL_APP_KEY secret is missing"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import os

          # Find settings.gradle
          settings = None

          for file in [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts")
          ]:
              if file.exists():
                  settings = file
                  break

          if settings is None:
              raise SystemExit(
                  "ERROR: No Android settings.gradle file found"
              )

          print("Using:", settings)

          text = settings.read_text()

          appodeal_repo = (
              'maven { '
              'url = uri("https://artifactory.appodeal.com/appodeal") '
              '}'
          )

          if "artifactory.appodeal.com/appodeal" not in text:
              if "repositories {" in text:
                  text = text.replace(
                      "repositories {",
                      "repositories {\n        " + appodeal_repo,
                      1
                  )
              else:
                  text += (
                      "\nrepositories {\n"
                      "    " + appodeal_repo + "\n"
                      "}\n"
                  )

              settings.write_text(text)

          # Find app Gradle file
          app_gradle = None

          for file in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]:
              if file.exists():
                  app_gradle = file
                  break

          if app_gradle is None:
              raise SystemExit(
                  "ERROR: No Android app Gradle file found"
              )

          print("Using:", app_gradle)

          text = app_gradle.read_text()

          appodeal = """
              implementation("com.appodeal.ads.sdk:core:4.4.0")
              implementation("com.appodeal.ads.sdk.adapters:amazon:12.0.0.0")
              implementation("com.appodeal.ads.sdk.adapters:applovin:13.6.3.0")
              implementation("com.appodeal.ads.sdk.adapters:applovin_max:13.6.3.1")
              implementation("com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0")
              implementation("com.appodeal.ads.sdk.adapters:bidon:0.14.0.0")
              implementation("com.appodeal.ads.sdk.adapters:bigo_ads:5.9.0.0")
              implementation("com.appodeal.ads.sdk.adapters:chartboost:9.10.2.0")
              implementation("com.appodeal.ads.sdk.adapters:dt_exchange:8.4.6.0")
              implementation("com.appodeal.ads.sdk.adapters:iab:1.8.1.1")
              implementation("com.appodeal.ads.sdk.adapters:inmobi:11.3.0.0")
              implementation("com.appodeal.ads.sdk.adapters:ironsource:9.4.4.0")
              implementation("com.appodeal.ads.sdk.adapters:level_play:9.4.4.0")
              implementation("com.appodeal.ads.sdk.adapters:mintegral:17.1.61.0")
              implementation("com.appodeal.ads.sdk.adapters:mobilefuse:1.11.0.0")
              implementation("com.appodeal.ads.sdk.adapters:moloco:4.3.1.0")
              implementation("com.appodeal.ads.sdk.adapters:my_target:5.47.1.0")
              implementation("com.appodeal.ads.sdk.adapters:ogury:6.2.0.0")
              implementation("com.appodeal.ads.sdk.adapters:pubmatic:4.10.0.0")
              implementation("com.appodeal.ads.sdk.adapters:smaato:22.7.2.0")
              implementation("com.appodeal.ads.sdk.adapters:startio:5.2.4.0")
              implementation("com.appodeal.ads.sdk.adapters:taurusx:1.12.2.0")
              implementation("com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0")
              implementation("com.appodeal.ads.sdk.adapters:verve:3.7.1.0")
              implementation("com.appodeal.ads.sdk.adapters:vungle:7.7.4.0")
              implementation("com.appodeal.ads.sdk.adapters:yandex:7.17.0.0")
          """

          if "com.appodeal.ads.sdk:core:4.4.0" not in text:
              if "dependencies {" not in text:
                  raise SystemExit(
                      "ERROR: dependencies block not found"
                  )

              text = text.replace(
                  "dependencies {",
                  "dependencies {\n" + appodeal,
                  1
              )

              app_gradle.write_text(text)

          # Network security
          xml_dir = Path(
              "android/app/src/main/res/xml"
          )

          xml_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          network_file = (
              xml_dir / "network_security_config.xml"
          )

          network_file.write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          """
          )

          # Android manifest
          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )

          manifest_text = manifest.read_text()

          if "android:networkSecurityConfig=" not in manifest_text:
              manifest_text = manifest_text.replace(
                  "<application",
                  '<application android:networkSecurityConfig="@xml/network_security_config"',
                  1
              )

              manifest.write_text(manifest_text)

          # MainActivity
          activity = Path(
              "android/app/src/main/java/com/tiletrails/game/MainActivity.java"
          )

          activity.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          key = os.environ["APPODEAL_APP_KEY"]

          java = """package com.tiletrails.game;

          import android.os.Bundle;

          import androidx.annotation.Nullable;

          import com.appodeal.ads.Appodeal;
          import com.appodeal.ads.initialization.ApdInitializationCallback;
          import com.appodeal.ads.initialization.ApdInitializationError;
          import com.getcapacitor.BridgeActivity;

          import java.util.List;

          public class MainActivity extends BridgeActivity {

              @Override
              protected void onCreate(
                      @Nullable Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  int adTypes =
                          Appodeal.BANNER |
                          Appodeal.INTERSTITIAL;

                  Appodeal.initialize(
                          this,
                          "%s",
                          adTypes,
                          new ApdInitializationCallback() {

                              @Override
                              public void onInitializationFinished(
                                      @Nullable List<ApdInitializationError> errors) {

                                  Appodeal.show(
                                          MainActivity.this,
                                          Appodeal.BANNER
                                  );
                              }
                          }
                  );
              }
          }
          """ % key

          activity.write_text(java)

          print("Appodeal configured successfully")
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tile-trails-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Remove secret
        env:
          APPODEAL_APP_KEY: ${{ secrets.APPODEAL_APP_KEY }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          key = os.environ.get("APPODEAL_APP_KEY", "")

          if key:
              for file in Path("android").rglob("*"):
                  if not file.is_file():
                      continue

                  try:
                      text = file.read_text()
                  except:
                      continue

                  if key in text:
                      file.write_text(
                          text.replace(
                              key,
                              "APPODEAL_APP_KEY"
                          )
                      )
          PY

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes to commit"
          else
            git commit -m "Build Android project with Appodeal"
            git push
          fi
