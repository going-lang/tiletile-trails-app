name: Build Tile Trails APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate app icon
        run: |
          if [ ! -f app-icon.png ]; then
            echo "ERROR: app-icon.png not found"
            exit 1
          fi

          npm install --no-save @capacitor/assets

          mkdir -p assets
          cp app-icon.png assets/icon-only.png

          npx capacitor-assets generate --android

      - name: Configure Appodeal
        env:
          APPODEAL_APP_KEY: ${{ secrets.APPODEAL_APP_KEY }}
        run: |
          if [ -z "$APPODEAL_APP_KEY" ]; then
            echo "ERROR: APPODEAL_APP_KEY secret is missing"
            exit 1
          fi

          python3 scripts/configure_appodeal.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tile-trails-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove Appodeal secret
        env:
          APPODEAL_APP_KEY: ${{ secrets.APPODEAL_APP_KEY }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          key = os.environ.get("APPODEAL_APP_KEY", "")

          if key:
              for file in Path("android").rglob("*"):
                  if not file.is_file():
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  if key in text:
                      file.write_text(text.replace(key, "APPODEAL_APP_KEY"))

          print("Secret removed from Android files.")
          PY

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes to commit."
          else
            git commit -m "Generate Android project with Appodeal"
            git push
          fi
